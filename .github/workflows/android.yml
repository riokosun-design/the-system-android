# ═══════════════════════════════════════════════════════════════════
# THE SYSTEM — Cloud Build Pipeline (no PC required)
# Push to main → GitHub builds the APK → download from Artifacts on phone.
#
# SETUP (one time, from phone browser):
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#   Required:  GOOGLE_SERVER_CLIENT_ID, MAPTILER_API_KEY
#   Optional:  SUPABASE_URL / SUPABASE_ANON_KEY (fall back to live values below)
#   Release:   flip repo Variable RELEASE_ENABLED=true + add
#              RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_PASSWORD
# ═══════════════════════════════════════════════════════════════════
name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # anon key is public-by-design (RLS is the boundary; it ships inside the APK anyway)
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://qpxxthjndnqtgjlrwteq.supabase.co' }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFweHh0aGpuZG5xdGdqbHJ3dGVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMjM1OTMsImV4cCI6MjEwMTc5OTU5M30.5PY4McgA7tKBWkVvEeBRTSzjeLuHBX4E_kVmhc2YEzc' }}
  GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
  OFFERWALL_URL: ${{ secrets.OFFERWALL_URL }}
  MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}

jobs:
  debug:
    name: Debug APK (daily driver / testing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare gradle.properties (env secrets override template placeholders)
        run: |
          cp gradle.properties.template gradle.properties
          sed -i '/^SUPABASE_URL=/d;/^SUPABASE_ANON_KEY=/d;/^GOOGLE_SERVER_CLIENT_ID=/d;/^OFFERWALL_URL=/d;/^MAPTILER_API_KEY=/d;/^RELEASE_/d' gradle.properties
          echo "SUPABASE_URL=$SUPABASE_URL" >> gradle.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> gradle.properties
          [ -n "$GOOGLE_SERVER_CLIENT_ID" ] && echo "GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID" >> gradle.properties || true
          [ -n "$OFFERWALL_URL" ] && echo "OFFERWALL_URL=$OFFERWALL_URL" >> gradle.properties || true
          [ -n "$MAPTILER_API_KEY" ] && echo "MAPTILER_API_KEY=$MAPTILER_API_KEY" >> gradle.properties || true

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify signing cert (SHA-1 must match Google OAuth Android client)
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: the-system-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  release:
    name: Release AAB/APK (Play upload build)
    # flip repo Variable RELEASE_ENABLED=true once keystore secrets are in place
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore (from base64 secret)
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/thesystem-release.keystore

      - name: Prepare gradle.properties
        run: |
          cp gradle.properties.template gradle.properties
          sed -i '/^SUPABASE_URL=/d;/^SUPABASE_ANON_KEY=/d;/^GOOGLE_SERVER_CLIENT_ID=/d;/^OFFERWALL_URL=/d;/^MAPTILER_API_KEY=/d;/^RELEASE_/d' gradle.properties
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=thesystem"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> gradle.properties
          [ -n "$GOOGLE_SERVER_CLIENT_ID" ] && echo "GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID" >> gradle.properties || true
          [ -n "$OFFERWALL_URL" ] && echo "OFFERWALL_URL=$OFFERWALL_URL" >> gradle.properties || true
          [ -n "$MAPTILER_API_KEY" ] && echo "MAPTILER_API_KEY=$MAPTILER_API_KEY" >> gradle.properties || true

      - name: Build release AAB + APK
        run: ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace -x lintVitalRelease

      - name: Verify signing cert (SHA-1 must match Google OAuth Android client)
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: the-system-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          retention-days: 30
